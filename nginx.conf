# Balanceador de carga para las réplicas del componente API.
# Usamos el DNS interno de Docker (127.0.0.11) SIN cachear la resolución,
# así nginx reparte cada request entre todas las instancias levantadas con
# `docker compose up --scale api=N` (round robin), sin listarlas a mano.
events {}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $upstream api:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
        }
    }
}
