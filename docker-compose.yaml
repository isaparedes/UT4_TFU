services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfu4
      POSTGRES_PASSWORD: tfu4
      POSTGRES_DB: tfu4
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfu4"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://tfu4:tfu4@db:5432/tfu4
      JWT_SECRET: cambiar-en-produccion
    depends_on:
      db:
        condition: service_healthy
    # Sin "ports": no se expone puerto fijo por instancia, así se puede
    # levantar en varias réplicas (--scale api=3) sin choque de puertos.
    # Se accede siempre a través del balanceador (nginx).

  balanceador:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  db_data:
