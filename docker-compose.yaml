services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfu4
      POSTGRES_PASSWORD: tfu4
      POSTGRES_DB: tfu4
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfu4"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Patrón de rendimiento: Caché-Aside
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file:
      - .env  
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Patrón de rendimiento: Caché-Aside
      REDIS_URL: ${REDIS_URL}
      # Patrón de rendimiento: Queue-Based Load Leveling
      REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
      # Patrón de seguridad: Federated Identity
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  balanceador:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  # Patrón de rendimiento: Queue-Based Load Leveling
  worker:
    build: .
    command: rq worker adopciones --url redis://redis:6379/1
    env_file:
      - .env  
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data: