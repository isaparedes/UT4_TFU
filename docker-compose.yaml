
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfu4
      POSTGRES_PASSWORD: tfu4
      POSTGRES_DB: tfu4
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfu4"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Patrón de rendimiento: Caché-Aside
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://tfu4:tfu4@db:5432/tfu4
      JWT_SECRET: cambiar-en-produccion
      # Patrón de rendimiento: Caché-Aside
      REDIS_URL: redis://redis:6379/0
      # Patrón de rendimiento: Queue-Based Load Leveling
      REDIS_QUEUE_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  balanceador:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  # Patrón de rendimiento: Queue-Based Load Leveling
  worker:
    build: .
    command: rq worker adopciones --url redis://redis:6379/1
    environment:
      DATABASE_URL: postgresql+psycopg2://tfu4:tfu4@db:5432/tfu4
      JWT_SECRET: cambiar-en-produccion
      REDIS_URL: redis://redis:6379/0
      REDIS_QUEUE_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
